name: Homebrew installation

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Install the checked-out formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          if brew help trust >/dev/null 2>&1; then
            brew trust --formula hamadasalhab/tap/agent-sync
          fi
          brew tap HamadaSalhab/tap "$GITHUB_WORKSPACE"
          brew style HamadaSalhab/tap/agent-sync
          brew install --build-from-source HamadaSalhab/tap/agent-sync
          brew audit --strict HamadaSalhab/tap/agent-sync
          brew test HamadaSalhab/tap/agent-sync
